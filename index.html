<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>pigin</title>
<meta name="description" content="a pigeon" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0a0d12; --paper:#f4f1ea; --sky:#7fb2e8; --dim:#8a93a3; --hot:#ff7a3d;
  --disp:"Bebas Neue",Impact,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.4vw,32px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:#05070a}
.shot{position:absolute;inset:0;opacity:0;transition:opacity 1.05s cubic-bezier(.4,0,.2,1)}
.shot.on{opacity:1}
.shot img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;will-change:transform}
.shot.on img{animation:push 22s ease-out forwards}
@keyframes push{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.grade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(88% 70% at 50% 44%,rgba(10,13,18,0) 32%,rgba(10,13,18,.72)),
             linear-gradient(180deg,rgba(10,13,18,.6),rgba(10,13,18,0) 24%,rgba(10,13,18,0) 60%,rgba(10,13,18,.92))}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.1;
  background-image:radial-gradient(rgba(255,255,255,.9) .6px,transparent .6px);background-size:3px 3px}

/* ---------- the word ---------- */
.word{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;width:100%}
.word h1{font-family:var(--disp);font-size:clamp(84px,22vw,300px);line-height:.78;letter-spacing:.02em;color:var(--paper);
  text-shadow:0 18px 70px rgba(0,0,0,.75);transition:opacity .6s,transform .6s}
.word.off h1{opacity:0;transform:scale(1.08)}
.word .tag{margin-top:clamp(6px,1vw,14px);font-family:var(--mono);font-size:clamp(10px,1.2vw,13px);letter-spacing:.4em;text-transform:uppercase;color:rgba(244,241,234,.72);transition:opacity .5s}
.word.off .tag{opacity:0}

/* ---------- caption ---------- */
.cap{position:fixed;left:var(--pad);bottom:var(--pad);z-index:5;max-width:min(520px,78vw);pointer-events:none}
.cap b{display:block;font-family:var(--disp);font-size:clamp(26px,4.4vw,62px);line-height:.96;letter-spacing:.01em;
  opacity:0;transform:translateY(16px);transition:opacity .55s,transform .55s}
.cap span{display:block;margin-top:8px;font-size:12px;color:rgba(244,241,234,.62);
  opacity:0;transform:translateY(12px);transition:opacity .55s .1s,transform .55s .1s}
.cap.on b,.cap.on span{opacity:1;transform:none}

/* ---------- hud ---------- */
.hud{position:fixed;z-index:9;display:flex;gap:6px;align-items:center}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad)}
.key{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);border:1px solid rgba(244,241,234,.28);background:rgba(10,13,18,.42);backdrop-filter:blur(8px);transition:background .18s,border-color .18s}
.key:hover{background:rgba(244,241,234,.15);border-color:var(--paper)}
.key img{width:20px;height:20px;border-radius:50%}
.key.buy{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.key.buy:hover{background:#fff}
.pmark{width:14px;height:14px;min-width:14px;object-fit:contain}
.dots{position:fixed;right:var(--pad);top:50%;transform:translateY(-50%);z-index:8;display:grid;gap:9px}
.dots i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(244,241,234,.28);transition:background .3s,transform .3s}
.dots i.on{background:var(--paper);transform:scale(1.6)}

.runway{position:relative;z-index:2;pointer-events:none}

/* ---------- the last frame: CA on the departure board ---------- */
.end{position:relative;z-index:6;background:var(--ink);min-height:100svh;display:grid;place-content:center;justify-items:center;gap:clamp(14px,2vw,22px);padding:clamp(50px,8vw,110px) var(--pad)}
.end .bg{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;opacity:.26}
.end .veil{position:absolute;inset:0;background:radial-gradient(64% 60% at 50% 46%,rgba(10,13,18,.5),rgba(10,13,18,.96))}
.end h2,.board,.end .btns,.end .fine{position:relative}
.end h2{font-family:var(--disp);font-size:clamp(30px,6vw,86px);line-height:.9;text-align:center;letter-spacing:.01em}
.board{width:min(720px,94vw);background:#0d1117;border:1px solid rgba(244,241,234,.16);padding:clamp(14px,2vw,20px);cursor:pointer}
.board .row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.flap{margin-top:12px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.flap i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:clamp(15px,2.4vw,25px);height:clamp(22px,3.4vw,36px);padding:0 2px;
  background:#161c25;border-radius:2px;font-family:var(--mono);font-weight:500;font-size:clamp(11px,1.7vw,17px);color:var(--paper);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
.flap i.soonword{background:none;box-shadow:none;font-family:var(--disp);font-size:clamp(34px,7vw,72px);min-width:auto;height:auto;letter-spacing:.02em}
.board .cp{margin-top:14px;display:block;width:100%;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.board.live .cp{color:var(--hot)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.end .fine{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#4a5462}

@media (max-width:820px){
  .tr .key.buy span{display:none}
  .tl span{display:none}
  .tl .key{padding:0 9px}
  .cap{max-width:calc(100% - var(--pad)*2)}
  .cap b{font-size:26px}
  .dots{right:calc(var(--pad) - 4px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="shot"><img src="assets/s1.webp" alt="" /></div>
  <div class="shot"><img src="assets/s2.webp" alt="" /></div>
  <div class="shot"><img src="assets/s3.webp" alt="" /></div>
  <div class="shot"><img src="assets/s4.webp" alt="" /></div>
  <div class="shot"><img src="assets/s5.webp" alt="" /></div>
  <div class="shot"><img src="assets/s6.webp" alt="" /></div>
</div>
<div class="grade"></div><div class="grain"></div>

<a class="hud tl key" href="./"><img src="assets/avatar.webp" alt="" /><span data-name>pigin</span></a>
<nav class="hud tr">
  <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>Buy</span><img class="pmark" src="assets/pons-mark.png" alt="" /></a>
  <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg width="13" height="13" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></svg></a>
</nav>

<div class="word" id="word"><h1 data-name>pigin</h1><div class="tag">a pigeon</div></div>
<div class="cap" id="cap"><b id="capB"></b><span id="capS"></span></div>
<div class="dots" id="dots"></div>

<div class="runway" id="runway"></div>

<section class="end">
  <img class="bg" src="assets/s3.webp" alt="" />
  <div class="veil"></div>
  <h2>he is not going<br />anywhere</h2>
  <div class="board" id="board">
    <div class="row"><span>Contract</span><span>Robinhood Chain</span></div>
    <div class="flap" id="flap"></div>
    <button class="cp" id="cp">Copy</button>
  </div>
  <div class="btns">
    <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad">Buy on Pons<img class="pmark" src="assets/pons-mark.png" alt="" /></a>
    <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg width="13" height="13" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></svg></a>
  </div>
  <div class="fine" data-name>pigin</div>
</section>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });

  var bgm = document.getElementById('bgm'), armed = false, ok = true;
  bgm.addEventListener('error', function(){ ok = false; });
  function arm(){ if(armed) return; armed = true; if(ok){ bgm.volume = .18; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LINES = [
    ['nobody asked him to be here', 'he was here first'],
    ['he has seen the whole valley', 'he did not care for it'],
    ['the square is his', 'it has always been his'],
    ['the storm is a personal insult', 'he stays on the ledge'],
    ['traffic stops for him', 'he never checks'],
    ['this is the face', 'that is the whole thing']
  ];

  var shots = [].slice.call(document.querySelectorAll('.shot'));
  var word = document.getElementById('word'), cap = document.getElementById('cap');
  var capB = document.getElementById('capB'), capS = document.getElementById('capS');
  var dots = document.getElementById('dots'), runway = document.getElementById('runway');
  shots.forEach(function(){ dots.appendChild(document.createElement('i')); });
  var pips = [].slice.call(dots.querySelectorAll('i'));

  var cur = -1;
  function show(k){
    if(k === cur) return;
    cur = k;
    shots.forEach(function(s, i){ s.classList.toggle('on', i === k); });
    pips.forEach(function(p, i){ p.classList.toggle('on', i === k); });
    word.classList.toggle('off', k > 0);
    cap.classList.remove('on');
    setTimeout(function(){
      capB.textContent = LINES[k][0]; capS.textContent = LINES[k][1];
      if(k > 0) cap.classList.add('on');
    }, 300);
  }

  function layout(){ runway.style.height = ((innerHeight || 800) * (shots.length * 1.05 + 0.2)) + 'px'; }
  addEventListener('resize', function(){ layout(); step(); });
  addEventListener('load', function(){ layout(); step(); });
  layout();

  function step(){
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    var H = Math.max(1, runway.offsetHeight - (innerHeight || 800));
    var p = Math.max(0, Math.min(0.9999, y / H));
    show(Math.min(shots.length - 1, Math.floor(p * shots.length)));
    document.documentElement.classList.toggle('past', p > .995);
  }
  addEventListener('scroll', step, { passive: true });
  show(0); step();

  /* ---- the departure board flips the address in ---- */
  var flap = document.getElementById('flap'), board = document.getElementById('board'), cp = document.getElementById('cp');
  var CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789x';
  function build(){
    flap.innerHTML = '';
    if(!HAS){ var w = document.createElement('i'); w.className = 'soonword'; w.textContent = 'soon'; flap.appendChild(w); return []; }
    board.classList.add('live');
    return CA.split('').map(function(c){ var i = document.createElement('i'); i.textContent = '-'; flap.appendChild(i); return { el:i, ch:c }; });
  }
  var cells = build(), rolled = false;
  function roll(){
    if(rolled || !cells.length) return; rolled = true;
    cells.forEach(function(c, idx){
      if(reduce){ c.el.textContent = c.ch; return; }
      var n = 0, spins = 6 + idx % 7;
      var t = setInterval(function(){
        c.el.textContent = CH[Math.floor(Math.random() * CH.length)];
        if(++n >= spins){ clearInterval(t); c.el.textContent = c.ch; }
      }, 42 + idx * 4);
    });
  }
  if('IntersectionObserver' in window) new IntersectionObserver(function(e){ if(e[0].isIntersecting) roll(); }, { threshold:.4 }).observe(board);
  else roll();

  board.addEventListener('click', function(){
    var old = cp.textContent;
    if(HAS){ if(navigator.clipboard) navigator.clipboard.writeText(CA); cp.textContent = 'Copied'; }
    else cp.textContent = 'Not yet';
    setTimeout(function(){ cp.textContent = old; }, 1300);
  });
})();
</script>
</body>
</html>
