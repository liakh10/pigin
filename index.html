<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>pigin</title>
<meta name="description" content="he took the highest spot in the city and never said why" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preload" as="image" href="assets/f1.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --night:#0b1020; --paper:#f3ecd8; --sky:#79b4e6; --cap:#3f7a3a; --feather:#e0433a; --dim:#8b95a8;
  --disp:"Jersey 15","Press Start 2P",monospace; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.4vw,32px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--paper);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- the reel: six slides of one place, running on their own ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:#0b1020;z-index:1}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.5}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 74% at 50% 46%,rgba(11,16,32,0) 46%,rgba(11,16,32,.78))}

.word{position:absolute;left:var(--pad);bottom:calc(var(--pad) + 8px);z-index:3;pointer-events:none;max-width:min(640px,80vw);transition:opacity .7s}
.word.hide{opacity:0}
.word .eye{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(243,236,216,.7);margin-bottom:8px}
.word h1{font-family:var(--disp);font-size:clamp(88px,19vw,240px);line-height:.78;letter-spacing:.02em;color:var(--paper);
  text-shadow:0 0 22px rgba(0,0,0,.55),5px 5px 0 #182338;transition:color .9s,text-shadow .9s}
.word.dusk h1{color:#ffcf6a;text-shadow:0 0 30px rgba(255,150,60,.35),5px 5px 0 #3a1a12}
.word.night h1{color:#cfe0ff;text-shadow:0 0 34px rgba(120,160,255,.35),5px 5px 0 #0a0f22}
.word p{margin-top:10px;font-size:clamp(12px,1.3vw,15px);line-height:1.55;color:rgba(243,236,216,.86);max-width:44ch;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.word p b{font-weight:600;color:var(--paper)}
.said{display:block;transition:opacity .45s}
.said.out{opacity:0}

.skip{position:fixed;right:var(--pad);bottom:var(--pad);z-index:5;font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,236,216,.55);transition:opacity .5s,color .2s}
.skip:hover{color:var(--paper)}
.skip.gone{opacity:0;pointer-events:none}

/* ---------- hud: stays out of the way until the reel is done ---------- */
.hud{position:fixed;z-index:9;display:flex;gap:6px;align-items:center;opacity:0;pointer-events:none;transition:opacity .8s}
.hud.on{opacity:1;pointer-events:auto}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad)}
.key{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;font-family:var(--disp);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper);background:rgba(11,16,32,.55);border:2px solid var(--paper);box-shadow:3px 3px 0 #182338;transition:transform .12s,box-shadow .12s}
.key:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #182338}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #182338}
.key img.av{width:20px;height:20px;border:1px solid var(--paper)}
.key.buy{background:var(--paper);color:var(--night)}
.pmark{width:14px;height:14px;min-width:14px;object-fit:contain}
.key .ico{width:15px;height:15px;min-width:15px;object-fit:contain}

/* ---------- the menu that comes up once he is done looking at the city ---------- */
.menu{position:fixed;left:0;right:0;bottom:0;z-index:8;transform:translateY(103%);transition:transform 1.05s cubic-bezier(.16,.86,.26,1);
  padding:clamp(26px,5vw,44px) var(--pad) calc(var(--pad) + 6px);
  background:linear-gradient(180deg,rgba(11,16,32,0),rgba(11,16,32,.86) 22%,rgba(11,16,32,.97) 46%,#0b1020 78%);
  max-height:92svh;overflow:auto}
.menu.on{transform:translateY(0)}
.sheet{width:min(1080px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,auto) minmax(320px,1fr);gap:clamp(18px,3vw,44px);align-items:end}
.mark h2{font-family:var(--disp);font-size:clamp(58px,11vw,132px);line-height:.8;letter-spacing:.02em;color:#cfe0ff;text-shadow:0 0 30px rgba(120,160,255,.3),5px 5px 0 #0a0f22}
.mark .tk{margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#ffcf6a}
.mark .ln{margin-top:8px;font-size:12.5px;color:var(--dim);max-width:34ch}
.right{display:grid;gap:10px;justify-items:stretch}
.board{background:#0f1730;border:2px solid var(--paper);box-shadow:5px 5px 0 #182338;padding:clamp(12px,1.7vw,18px);cursor:pointer}
.board .row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.flap{margin-top:10px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.flap i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:clamp(14px,2.1vw,22px);height:clamp(20px,3vw,32px);padding:0 2px;
  background:#1a2444;font-family:var(--mono);font-weight:600;font-size:clamp(10px,1.5vw,15px);color:var(--paper);box-shadow:inset 0 -2px 0 rgba(0,0,0,.5)}
.flap i.soonword{background:none;box-shadow:none;font-family:var(--disp);font-weight:400;font-size:clamp(38px,7vw,72px);min-width:auto;height:auto;letter-spacing:.03em;line-height:.9}
.board .cp{margin-top:10px;display:block;width:100%;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.board.live .cp{color:#ffcf6a}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .key{flex:1 1 auto}
.again{justify-self:start;font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#48526a;transition:color .2s}
.again:hover{color:var(--paper)}

/* ---------- the sightings: a drawer of memes, and one big look at each ---------- */
/* the sightings sit in the open, straight in the menu, the way gote puts them out */
.grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid button{position:relative;display:block;padding:0;border:2px solid rgba(243,236,216,.32);background:#0b1020;transition:border-color .15s,transform .12s}
.grid button:hover{border-color:var(--paper);transform:translate(-1px,-1px)}
.grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}

.lb{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:var(--pad);background:rgba(6,9,20,.94)}
.lb.on{display:grid}
.lbin{width:min(1080px,100%);display:grid;gap:10px;justify-items:center}
.lb img{width:100%;max-height:74svh;object-fit:contain;border:2px solid var(--paper);box-shadow:6px 6px 0 #182338;image-rendering:pixelated;image-rendering:crisp-edges}
.lbbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.lbbar .cap{color:rgba(243,236,216,.82);letter-spacing:.12em;text-transform:none;font-size:12px}
.lbnav{display:flex;gap:6px}
.lbnav button{border:2px solid var(--paper);background:rgba(11,16,32,.6);color:var(--paper);width:34px;height:30px;box-shadow:3px 3px 0 #182338;font-family:var(--disp);font-size:17px;line-height:1}
.lbnav button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #182338}

@media (max-width:900px){
  .sheet{grid-template-columns:1fr;align-items:start;gap:16px}
  .mark h2{font-size:clamp(52px,15vw,84px)}
  .mark .ln{display:none}
  .tr .key.buy span{display:none}
  .tl span{display:none}
  .word{max-width:calc(100% - var(--pad)*2)}
  .word h1{font-size:74px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .skip{bottom:auto;top:var(--pad)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<a class="hud tl key" id="hudl" href="./"><img class="av" src="assets/avatar.webp" alt="" /><span data-name>pigin</span></a>
<nav class="hud tr" id="hudr">
  <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>Buy</span><img class="pmark" src="assets/pons-mark.png" alt="" /></a>
  <a class="key" data-link="x" href="https://x.com" aria-label="X">X</a>
</nav>

<section class="stage">
  <canvas id="cv"></canvas>
  <div class="crt"></div><div class="vig"></div>
  <div class="word" id="word">
    <div class="eye"><span class="said" id="eye">Highest point in the city · occupants: 1</span></div>
    <h1 data-name>pigin</h1>
    <p><span class="said" id="line">He took the highest spot in the city and never said why. <b>Nobody has asked him to come down.</b></span></p>
  </div>
</section>

<button class="skip" id="skip">Skip</button>

<div class="menu" id="menu">
  <div class="sheet">
    <div class="mark">
      <h2 data-name>pigin</h2>
      <div class="tk" data-ticker>$PIGIN</div>
      <div class="ln">still up there, still not coming down</div>
    </div>
    <div class="right">
      <div class="board" id="board">
        <div class="row"><span>Contract</span><span>Robinhood Chain · Pons</span></div>
        <div class="flap" id="flap"></div>
        <button class="cp" id="cp">Copy</button>
      </div>
      <div class="btns">
        <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad">Buy on Pons<img class="pmark" src="assets/pons-mark.png" alt="" /></a>
        <a class="key" data-link="dex" href="https://dexscreener.com/robinhood">Chart<img class="ico" src="assets/ic-dex.svg" alt="" /></a>
        <a class="key" data-link="x" href="https://x.com" aria-label="X">X</a>
      </div>
      <button class="again" id="again">Watch again</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="lb" id="lb">
  <div class="lbin">
    <img id="lbimg" src="" alt="" />
    <div class="lbbar">
      <span class="cap" id="lbcap"></span>
      <span class="lbnav"><button id="lbprev" aria-label="Previous">&#8249;</button><span id="lbn" style="align-self:center;padding:0 6px"></span><button id="lbnext" aria-label="Next">&#8250;</button><button id="lbx" aria-label="Close">&#10005;</button></span>
    </div>
  </div>
</div>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.querySelectorAll('[data-ticker]').forEach(function(e){ e.textContent = S.TICKER; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="dex"]').forEach(function(a){ a.href = HAS ? window.DEX_HOME + '/' + CA : window.DEX_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });

  var bgm = document.getElementById('bgm'), armed = false, ok = true;
  bgm.addEventListener('error', function(){ ok = false; });
  function arm(){ if(armed) return; armed = true; if(ok){ bgm.volume = .18; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================== the reel ==================
     six renders of ONE place, the same green pigeon on the same tower: the camera
     a step closer each slide, the day a step later. the slides run on their own,
     a hold and then a cross fade into the next one, no scrolling anywhere. */
  var N = 6, IM = [];
  var STEP = 2.6;      /* seconds a slide owns */
  var HOLD = .56;      /* the first part of that is a still hold, the rest fades over */
  var TAIL = 1.6;      /* he sits on the last one before the menu comes up */
  var SPAN = (N - 1) * STEP, TOTAL = SPAN + TAIL;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var word = document.getElementById('word'), eye = document.getElementById('eye'), line = document.getElementById('line');
  var menu = document.getElementById('menu'), skip = document.getElementById('skip');
  var dirty = true, lastKey = -1, t0 = 0, running = false, done = false;

  for(var i = 0; i < N; i++){ var im = new Image(); im.onload = function(){ dirty = true; }; im.src = 'assets/f' + (i + 1) + '.jpg'; IM[i] = im; }

  function resize(){
    var d = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(cv.clientWidth * d)), h = Math.max(1, Math.floor(cv.clientHeight * d));
    if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; dirty = true; }
    ctx.imageSmoothingEnabled = false;
  }
  function paint(im, alpha){
    if(!im || !im.complete || !im.naturalWidth) return;
    ctx.globalAlpha = alpha;
    var s = Math.max(cv.width / im.naturalWidth, cv.height / im.naturalHeight);
    var w = im.naturalWidth * s, h = im.naturalHeight * s;
    ctx.drawImage(im, (cv.width - w) / 2, (cv.height - h) * 0.35, w, h);
    ctx.globalAlpha = 1;
  }
  function draw(idx, frac){
    resize();
    var key = idx * 100 + Math.round(frac * 24);
    if(key === lastKey && !dirty) return;
    lastKey = key; dirty = false;
    ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, cv.width, cv.height);
    paint(IM[idx], 1);
    if(frac > 0 && IM[idx + 1]) paint(IM[idx + 1], frac);
  }

  var TXT = [
    ['Highest point in the city · occupants: 1', 'He took the highest spot in the city and never said why. <b>Nobody has asked him to come down.</b>'],
    ['Late morning · same tower', 'The city woke up under him. <b>He watched it happen and had no notes.</b>'],
    ['Afternoon · still there', 'Boats went out, boats came back. <b>He counted none of them.</b>'],
    ['Golden hour · not moving', 'The light got good and he took it personally. <b>Stayed exactly where he was.</b>'],
    ['Dusk · lights coming on', 'Everyone below went home. <b>He does not have one of those.</b>'],
    ['Night · this is the face', 'The whole city glows and he is the highest thing in it. <b>That is the entire plan.</b>']
  ];
  var curT = -1;
  function words(k){
    if(k === curT) return;
    var first = curT < 0; curT = k;
    word.classList.toggle('dusk', k === 3 || k === 4);
    word.classList.toggle('night', k === 5);
    if(first || reduce){ eye.textContent = TXT[k][0]; line.innerHTML = TXT[k][1]; return; }
    eye.classList.add('out'); line.classList.add('out');
    setTimeout(function(){
      eye.textContent = TXT[curT][0]; line.innerHTML = TXT[curT][1];
      eye.classList.remove('out'); line.classList.remove('out');
    }, 260);
  }

  /* the clock, not the scrollbar, decides where we are */
  function at(t){
    if(t >= SPAN) return { idx:N - 1, frac:0, k:N - 1 };
    var k = Math.floor(t / STEP), u = (t - k * STEP) / STEP;
    var c = Math.max(0, Math.min(1, (u - HOLD) / (1 - HOLD)));
    return { idx:k, frac:c * c * (3 - 2 * c), k:(c > .5 ? k + 1 : k) };
  }
  function finish(){
    if(done) return; done = true; running = false;
    draw(N - 1, 0);
    word.classList.add('hide'); skip.classList.add('gone');
    menu.classList.add('on'); warmThumbs();
    document.getElementById('hudl').classList.add('on'); document.getElementById('hudr').classList.add('on');
    roll();
  }
  function loop(){
    if(!running) return;
    var t = (performance.now() - t0) / 1000;
    if(t >= TOTAL){ finish(); return; }
    var s = at(t); draw(s.idx, s.frac); words(s.k);
    requestAnimationFrame(loop);
  }
  function start(){
    done = false; curT = -1; lastKey = -1; dirty = true;
    word.classList.remove('hide'); skip.classList.remove('gone');
    menu.classList.remove('on');
    t0 = performance.now(); running = true; requestAnimationFrame(loop);
  }
  addEventListener('resize', function(){ lastKey = -1; dirty = true; if(!running){ draw(N - 1, 0); } });
  skip.addEventListener('click', finish);
  document.getElementById('again').addEventListener('click', function(){ words(0); start(); });

  if(reduce){ words(N - 1); draw(N - 1, 0); setTimeout(finish, 300); }
  else { words(0); start(); }

  /* ---- sightings: the drawer, and the big look ---- */
  var SEEN = [
    ['Took it from the rich, kept it at altitude', 'pigin on a heap of gold coins in a torchlit treasury'],
    ['Weather happened to everyone else', 'pigin on a weather vane in heavy rain'],
    ['The bell rang, he did not', 'pigin beside a swinging church bell'],
    ['The only one up here with a job', 'pigin on the shoulder of a stone knight'],
    ['Sat on the line, nobody moved him', 'pigin on a laundry line in an alley'],
    ['Warmest seat in the city', 'pigin on a smoking chimney at sunset']
  ];
  var grid = document.getElementById('grid'), lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'),
      lbcap = document.getElementById('lbcap'), lbn = document.getElementById('lbn'), gi = 0;
  grid.innerHTML = SEEN.map(function(m, i){
    return '<button data-i="' + i + '" aria-label="' + m[1] + '"><img data-src="assets/tg' + (i + 1) + '.webp" alt="' + m[1] + '" /></button>';
  }).join('');
  function warmThumbs(){
    grid.querySelectorAll('img[data-src]').forEach(function(i){ i.src = i.dataset.src; i.removeAttribute('data-src'); });
  }
  function show(k){
    gi = (k + SEEN.length) % SEEN.length;
    lbimg.src = 'assets/g' + (gi + 1) + '.webp'; lbimg.alt = SEEN[gi][1];
    lbcap.textContent = SEEN[gi][0]; lbn.textContent = (gi + 1) + ' / ' + SEEN.length;
    lb.classList.add('on');
  }
  grid.addEventListener('click', function(e){ var b = e.target.closest('button'); if(b) show(+b.dataset.i); });
  document.getElementById('lbprev').addEventListener('click', function(){ show(gi - 1); });
  document.getElementById('lbnext').addEventListener('click', function(){ show(gi + 1); });
  document.getElementById('lbx').addEventListener('click', function(){ lb.classList.remove('on'); });
  lb.addEventListener('click', function(e){ if(e.target === lb) lb.classList.remove('on'); });
  document.addEventListener('keydown', function(e){
    if(lb.classList.contains('on')){
      if(e.key === 'Escape') lb.classList.remove('on');
      if(e.key === 'ArrowLeft') show(gi - 1);
      if(e.key === 'ArrowRight') show(gi + 1);
    }
  });

  /* ---- departure board ---- */
  var flap = document.getElementById('flap'), board = document.getElementById('board'), cp = document.getElementById('cp');
  var CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789x';
  function build(){
    flap.innerHTML = '';
    if(!HAS){ var w = document.createElement('i'); w.className = 'soonword'; w.textContent = 'soon'; flap.appendChild(w); return []; }
    board.classList.add('live');
    return CA.split('').map(function(c){ var i = document.createElement('i'); i.textContent = '-'; flap.appendChild(i); return { el:i, ch:c }; });
  }
  var cells = build(), rolled = false;
  function roll(){
    if(rolled || !cells.length) return; rolled = true;
    cells.forEach(function(c, idx){
      if(reduce){ c.el.textContent = c.ch; return; }
      var n = 0, spins = 6 + idx % 7;
      var t = setInterval(function(){ c.el.textContent = CH[Math.floor(Math.random() * CH.length)]; if(++n >= spins){ clearInterval(t); c.el.textContent = c.ch; } }, 42 + idx * 4);
    });
  }
  board.addEventListener('click', function(){
    var old = cp.textContent;
    if(HAS){ if(navigator.clipboard) navigator.clipboard.writeText(CA); cp.textContent = 'Copied'; } else cp.textContent = 'Not yet';
    setTimeout(function(){ cp.textContent = old; }, 1300);
  });
})();
</script>
</body>
</html>
